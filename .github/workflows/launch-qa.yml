name: Launch browser QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/launch-repair-20261026]
permissions:
  contents: read
concurrency:
  group: launch-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: npm test
      - run: node scripts/check-agent-deployment.mjs
      - run: npm run build
      - run: npx playwright test
      - name: Read-only production verification
        run: node scripts/verify-production.mjs
      - name: Notify IndexNow after verified production ownership
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
