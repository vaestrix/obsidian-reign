name: Launch browser QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/launch-repair-20261026]
permissions:
  contents: read
concurrency:
  group: launch-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: npm test
      - run: node scripts/check-agent-deployment.mjs
      - run: npm run build
      - run: npx playwright test
      - name: Read-only production verification
        run: node scripts/verify-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  public-audit:
    env:
      AUDIT_ORIGIN: ${{ github.ref == 'refs/heads/main' && 'https://obsidianreign.gg' || 'http://127.0.0.1:4173' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.58.2 @axe-core/playwright@4.10.2 lighthouse@12.8.2
      - run: npm run build
      - run: |
          node scripts/qa-server.mjs &
          node scripts/audit-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-accessibility-performance-audit
          path: audit-results/
          retention-days: 14
  search-notification:
    if: github.ref == 'refs/heads/main'
    needs: browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Notify IndexNow only for indexable public changes
        run: node scripts/indexnow.mjs
