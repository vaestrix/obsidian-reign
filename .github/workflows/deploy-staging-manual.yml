name: Deploy Isolated Staging (Manual Only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-STAGING-ONLY to acknowledge this does not deploy production'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: obsidian-reign-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY-STAGING-ONLY' }}
    environment: obsidian-reign-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify isolated staging configuration
        run: |
          node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync('wrangler.staging.jsonc'));const p=JSON.parse(fs.readFileSync('wrangler.jsonc'));if(s.name!=='obsidian-reign-staging'||s.name===p.name||s.vars?.STAGING!=='true'||s.vars?.SAVANNAH_AUTO_SEND!=='false'||!s.r2_buckets?.some(b=>b.binding==='DELIVERY_BUCKET'&&b.bucket_name==='obsidian-reign-delivery-staging'))process.exit(1);"
      - name: Verify staging Cloudflare credentials configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Confirm private staging R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 20 \\
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \\
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/obsidian-reign-delivery-staging")
          printf '%s' "$response" | node -e "let raw='';process.stdin.on('data',x=>raw+=x);process.stdin.on('end',()=>{const j=JSON.parse(raw);if(j.success!==true||j.result?.name!=='obsidian-reign-delivery-staging')process.exit(1);console.log('Staging bucket exists in configured account. Public access must be reviewed separately.');})"
      - name: Deploy staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Run staging denial smoke checks
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: node scripts/staging-smoke.js
