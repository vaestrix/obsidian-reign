name: AI Workforce Checks
on:
  pull_request:
    paths:
      - 'src/agent-*.js'
      - 'src/portal.js'
      - 'test/agent-*.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-workforce-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check JavaScript syntax
        run: |
          node --check src/portal.js
          node --check src/agent-policy.js
          node --check src/agent-workflow.js
